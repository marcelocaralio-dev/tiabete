name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KS_ALIAS: ${{ secrets.KEY_ALIAS }}
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    name: Compilar APK TiaBete
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test

      - name: Preparar projeto Android
        run: npm run android:prepare

      - name: APK assinado (release)
        if: ${{ env.KS_B64 != '' }}
        run: |
          cd android && ./gradlew assembleRelease

          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"

          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"

          "$BT/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/ks.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --out "$GITHUB_WORKSPACE/TiaBete.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: APK de teste (debug)
        if: ${{ env.KS_B64 == '' }}
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TiaBete-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TiaBete-apk
          path: TiaBete*.apk

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TiaBete*.apk
